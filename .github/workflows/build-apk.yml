name: Otomatik Android APK Derleyici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: KodlarД± Г‡ek (Checkout)
        uses: actions/checkout@v4

      - name: Java JDK 17 Kur
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter SDK Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Paketleri Д°ndir
        run: flutter pub get

      - name: Android APK'yД± Derle (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: APK DosyasД±nД± Д°ndirilebilir Yap (Artifact Upload)
        uses: actions/upload-artifact@v4
        with:
          name: vardiya-pdks-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
